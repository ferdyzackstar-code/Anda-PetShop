<svg viewBox="0 0 160 130" width="160" height="130" xmlns="http://www.w3.org/2000/svg">
  <!-- Telinga kiri -->
  <polygon points="30,55 18,28 50,45" fill="#c8d4f8"/>
  <polygon points="32,53 23,33 46,46" fill="#ffb3b3"/>
