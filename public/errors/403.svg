  <line x1="32" y1="84" x2="68" y2="83" stroke="#aab" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Kumis kanan -->
  <line x1="130" y1="78" x2="92" y2="80" stroke="#aab" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="128" y1="84" x2="92" y2="83" stroke="#aab" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Tanda seru -->
  <text x="80" y="26" text-anchor="middle" font-size="22" font-weight="800" fill="#4e73df" font-family="sans-serif">!</text>
</svg>
