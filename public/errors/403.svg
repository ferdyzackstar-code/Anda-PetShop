  <polygon points="128,53 137,33 114,46" fill="#ffb3b3"/>
  <!-- Kepala -->
  <ellipse cx="80" cy="75" rx="48" ry="42" fill="#dce6ff"/>
  <!-- Alis kiri marah -->
  <line x1="50" y1="57" x2="70" y2="63" stroke="#3d4466" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Mata kiri -->
  <ellipse cx="62" cy="68" rx="9" ry="7" fill="#3d4466"/>
  <ellipse cx="65" cy="66" rx="3" ry="3" fill="#fff"/>
  <!-- Alis kanan marah -->
  <line x1="110" y1="57" x2="90" y2="63" stroke="#3d4466" stroke-width="2.5" stroke-linecap="round"/>
